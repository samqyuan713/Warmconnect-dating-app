services:
  # Backend API Service
  - type: web
    name: warmconnect-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warmconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/auth/me
    plan: free

  # Frontend Static Site
  - type: web
    name: warmconnect-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://warmconnect-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://warmconnect-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free

databases:
  - name: warmconnect-db
    databaseName: dating_db
    user: dating_user
    plan: free
    ipAllowList: []
